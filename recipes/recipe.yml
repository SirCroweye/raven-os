---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: raven-os
# description will be included in the image's metadata
description: Based on Wayblue niri-nvidia-open image, added nix, dank-material-shell.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - from-file: modules/sddm-modules.yml
  - from-file: modules/nix-modules.yml
  - from-file: modules/common-modules.yml
  - from-file: modules/nvidia-open-modules.yml
  - from-file: modules/niri-modules.yml
  - from-file: modules/xdg-desktop-portal-modules.yml
  - from-file: modules/final-modules.yml

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
