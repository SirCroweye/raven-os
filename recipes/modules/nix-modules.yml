modules:
  - type: script
    snippets:
    - "dnf5 install -y nix"
    - "mkdir -p /nix /var/nix"
    - "dnf5 clean all"

  # nix.mount wird mit allem anderen nach etc/systemd/system/ kopiert
  - type: files
    files:
      - source: system/etc/systemd/system/nix.mount
        destination: /etc/systemd/system/nix.mount

  - type: systemd
    system:
      enabled:
        - nix.mount
        - nix-daemon.service
