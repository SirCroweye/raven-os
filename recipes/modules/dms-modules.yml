modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - avengemedia/dms
          - avengemedia/danklinux
    install:
      packages:
        - dms
        - dms-greeter
        - dgop
        - dsearch
        - dcal
        - ghostty

  - type: systemd
