modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - avengemedia/dms
          - avengemedia/danklinux
    install:
      packages:
        - dms
        - dms-greeter
        - dgop
        - dsearch
        - dcal
        - ghostty

  - type: systemd
    user:
      enabled:
        - dms

  - type: files
    files:
      - source: system/etc/skel/.config/niri/dms/
        destination: /etc/skel/.config/niri/dms/
