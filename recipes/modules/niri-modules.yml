modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - niri
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk

  - type: files
    files:
      - source: system/usr
        destination: /usr

  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - avengemedia/dms
          - avengemedia/danklinux
    install:
      packages:
        - dms
        - dms-greeter
        - dgop
        - dsearch
        - dcal
        - ghostty

  - type: systemd
    user:
      enabled:
        - dms

  - type: files
    files:
      - source: system/etc/skel
        destination: /etc/skel
