modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - niri
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk

  - type: files
    files:
      - source: system/usr
        destination: /usr

  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - avengemedia/dms
          - avengemedia/danklinux
    install:
      packages:
        - dms
        - dms-greeter
        - dsearch

  - type: systemd
    user:
      enabled:
        - dms

  - type: script
    snippets:
      - "runuser -- dms setup headless --compositor niri --terminal kitty --force"
